# Virtual host exclusivo do DISC Funcional.
# Não altere nginx.conf nem o default_server dos outros sistemas.
server {
    listen 80;
    listen [::]:80;

    server_name disc.nxuslab.com;
    root /var/www/disc/public;
    index index.html;

    access_log /var/log/nginx/disc.access.log;
    error_log  /var/log/nginx/disc.error.log warn;

    # A aplicação é estática, mas mantém fallback para futuras rotas do front-end.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Arquivos internos do repositório nunca devem ser publicados.
    location ~ /(?:\.git|deploy|tests|db|config|src)(?:/|$) {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
